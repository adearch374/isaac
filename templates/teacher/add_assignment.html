<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Assignment</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"><style>.assignment-form{max-width:760px;background:#fff;padding:30px;border-radius:10px;box-shadow:0 2px 10px #0001}.assignment-form label{display:block;margin:0 0 7px;font-weight:600}.assignment-form input,.assignment-form textarea,.assignment-form select{width:100%;padding:12px;margin-bottom:18px;border:1px solid #ddd;border-radius:5px;font:inherit}.assignment-form textarea{min-height:120px;resize:vertical}.question-box{border:1px solid #ddd;border-radius:8px;padding:18px;margin:15px 0;background:#f8f9fa}.question-box input{margin-bottom:10px}.question-box button{margin-right:8px}.helper{color:#666;font-size:.85rem}.question-options{display:grid;gap:8px}</style></head>
<body><div class="dashboard-container"><aside class="sidebar"><div class="sidebar-header"><h2>Teacher Portal</h2><p>La Paix Group of Schools</p></div><nav class="sidebar-nav"><ul><li><a href="{{ url_for('teacher_dashboard') }}">Dashboard</a></li><li><a class="active" href="{{ url_for('teacher_assignments') }}">Assignments</a></li><li><a href="{{ url_for('teacher_requests') }}">Teaching Requests</a></li><li><a href="{{ url_for('teacher_results') }}">Results</a></li><li><a href="{{ url_for('logout') }}">Logout</a></li></ul></nav></aside><main class="main-content"><div class="top-bar"><h1>Create Assignment</h1><a class="btn btn-secondary" href="{{ url_for('teacher_assignments') }}">Back</a></div><form method="POST" class="assignment-form"><label for="title">Title</label><input id="title" name="title" required><label for="description">Instructions</label><textarea id="description" name="description" required></textarea><label for="class_id">Class and subject</label><select id="class_id" name="class_id" required><option value="">Choose an approved class and subject</option>{% for approved in approved_assignments %}<option value="{{ approved.class_id }}" data-subject="{{ approved.subject_id }}">{{ approved.class_assigned.name }} - {{ approved.subject.name }}</option>{% endfor %}</select><input type="hidden" name="subject_id" id="subject_id"><label for="due_date">Due date and time</label><input type="datetime-local" id="due_date" name="due_date" required><label for="max_score">Maximum score</label><input type="number" id="max_score" name="max_score" min="1" max="1000" value="100" required><label for="question_type">Question type</label><select id="question_type" name="question_type"><option value="theory">Theory</option><option value="multiple_choice">Multiple choice</option></select><div id="questions"></div><input type="hidden" name="questions_json" id="questions_json"><button type="button" class="btn btn-secondary" id="add-question">Add question</button><label for="google_form_url">Optional Google Forms link</label><input type="url" id="google_form_url" name="google_form_url" placeholder="https://docs.google.com/forms/"><p class="helper">For worksheets, students can still submit text or an allowed file from the assignment page.</p><button class="btn btn-primary" type="submit">Create Assignment</button></form></main></div><script>const type=document.getElementById('question_type'),list=document.getElementById('questions'),hidden=document.getElementById('questions_json');function addQuestion(){const box=document.createElement('div');box.className='question-box';box.innerHTML='<label>Question</label><input class="question-text" required><div class="question-options"></div><label class="correct-label">Correct answer</label><select class="correct-answer"></select><button type="button" class="btn btn-secondary add-option">Add option</button><button type="button" class="btn btn-secondary remove-question">Remove</button>';list.appendChild(box);if(type.value==='multiple_choice'){addOption(box);addOption(box)}box.querySelector('.add-option').onclick=()=>addOption(box);box.querySelector('.remove-question').onclick=()=>box.remove();box.addEventListener('input',sync)}function addOption(box){const input=document.createElement('input');input.className='question-option';input.placeholder='Answer option';input.required=true;box.querySelector('.question-options').appendChild(input)}function sync(){const questions=[...list.children].map(box=>{const options=[...box.querySelectorAll('.question-option')].map(x=>x.value.trim()).filter(Boolean);const correct=box.querySelector('.correct-answer');const current=correct.value;correct.innerHTML=options.map(option=>'<option>'+option.replace(/</g,'&lt;')+'</option>').join('');if(options.includes(current))correct.value=current;return{text:box.querySelector('.question-text').value,options,answer:correct.value||options[0]||''}});hidden.value=JSON.stringify(questions);list.querySelectorAll('.question-options').forEach(x=>x.style.display=type.value==='multiple_choice'?'grid':'none');list.querySelectorAll('.correct-label,.correct-answer,.add-option').forEach(x=>x.style.display=type.value==='multiple_choice'?'block':'none')}document.getElementById('class_id').onchange=e=>document.getElementById('subject_id').value=e.target.selectedOptions[0].dataset.subject||'';document.getElementById('add-question').onclick=addQuestion;type.onchange=()=>{list.innerHTML='';addQuestion();sync()};document.querySelector('form').onsubmit=()=>{sync();return true};addQuestion();sync();</script></body></html>
