<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Assignment</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"><style>.assignment-form{max-width:700px;background:white;padding:30px;border-radius:10px;box-shadow:0 2px 10px #0001}.assignment-form label{display:block;margin:0 0 7px;font-weight:600}.assignment-form input,.assignment-form textarea,.assignment-form select{width:100%;padding:12px;margin-bottom:18px;border:1px solid #ddd;border-radius:5px;font:inherit}.assignment-form textarea{min-height:150px;resize:vertical}</style></head>
<body><div class="dashboard-container"><aside class="sidebar"><div class="sidebar-header"><h2>Teacher Portal</h2><p>La Paix Group of Schools</p></div><nav class="sidebar-nav"><ul><li><a href="{{ url_for('teacher_dashboard') }}">Dashboard</a></li><li><a class="active" href="{{ url_for('teacher_assignments') }}">Assignments</a></li><li><a href="{{ url_for('teacher_requests') }}">Teaching Requests</a></li><li><a href="{{ url_for('teacher_results') }}">Results</a></li><li><a href="{{ url_for('logout') }}">Logout</a></li></ul></nav></aside><main class="main-content"><div class="top-bar"><h1>Create Assignment</h1><a class="btn btn-secondary" href="{{ url_for('teacher_assignments') }}">Back</a></div><form method="POST" class="assignment-form"><label for="title">Title</label><input id="title" name="title" required><label for="description">Instructions</label><textarea id="description" name="description" required></textarea><label for="class_id">Class and Subject</label><select id="class_id" name="class_id" required><option value="">Choose an approved class and subject</option>{% for approved in approved_assignments %}<option value="{{ approved.class_id }}" data-subject="{{ approved.subject_id }}">{{ approved.class_assigned.name }} - {{ approved.subject.name }}</option>{% endfor %}</select><input type="hidden" name="subject_id" id="subject_id"><label for="due_date">Due date and time</label><input type="datetime-local" id="due_date" name="due_date" required><label for="max_score">Maximum score</label><input type="number" id="max_score" name="max_score" min="1" max="1000" value="100" required><button class="btn btn-primary" type="submit">Create Assignment</button></form></main></div><script>document.getElementById('class_id').addEventListener('change',function(){document.getElementById('subject_id').value=this.selectedOptions[0].dataset.subject||'';});</script></body></html>
