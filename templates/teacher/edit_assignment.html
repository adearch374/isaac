<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit Assignment</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"><style>.assignment-form{max-width:700px;background:white;padding:30px;border-radius:10px;box-shadow:0 2px 10px #0001}.assignment-form label{display:block;margin:0 0 7px;font-weight:600}.assignment-form input,.assignment-form textarea{width:100%;padding:12px;margin-bottom:18px;border:1px solid #ddd;border-radius:5px;font:inherit}.assignment-form textarea{min-height:150px;resize:vertical}</style></head><body><div class="dashboard-container"><aside class="sidebar"><div class="sidebar-header"><h2>Teacher Portal</h2><p>La Paix Group of Schools</p></div><nav class="sidebar-nav"><ul><li><a href="{{ url_for('teacher_dashboard') }}">Dashboard</a></li><li><a class="active" href="{{ url_for('teacher_assignments') }}">Assignments</a></li><li><a href="{{ url_for('logout') }}">Logout</a></li></ul></nav></aside><main class="main-content"><div class="top-bar"><h1>Edit Assignment</h1><a class="btn btn-secondary" href="{{ url_for('teacher_assignments') }}">Back</a></div><form method="POST" class="assignment-form"><label for="title">Title</label><input id="title" name="title" value="{{ assignment.title }}" required><label for="description">Instructions</label><textarea id="description" name="description" required>{{ assignment.description }}</textarea><label for="due_date">Due date and time</label><input type="datetime-local" id="due_date" name="due_date" value="{{ assignment.due_date.strftime('%Y-%m-%dT%H:%M') }}" required><label for="max_score">Maximum score</label><input type="number" id="max_score" name="max_score" min="1" max="1000" value="{{ assignment.max_score }}" required><button class="btn btn-primary" type="submit">Save Changes</button></form></main></div></body></html>
